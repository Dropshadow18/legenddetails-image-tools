<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails Quote Image Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
.tool {
  background: #fff;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 8px;
}
label {
  font-weight: bold;
  display: block;
  margin-top: 10px;
}
input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
}
button {
  margin-top: 15px;
  padding: 12px 20px;
  background: #007bff;
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 16px;
}
canvas {
  display: none;
}
</style>
</head>

<body>
<div class="container">
<h1>LegendDetails – Quote Image Tool</h1>

<div class="tool">

<label>1. Post Title</label>
<input id="title" placeholder="Enter post title">

<label>2. Upload Background Image</label>
<input type="file" id="bgImage" accept="image/*">

<label>3. Quote (Any Language)</label>
<textarea id="quote" rows="4" placeholder="Enter quote (English / తెలుగు / हिंदी / தமிழ் / ಕನ್ನಡ)"></textarea>

<label>4. Select Image Size</label>
<select id="size">
  <option value="1200x675">1200 × 675 (Featured)</option>
  <option value="1600x900">1600 × 900 (HD)</option>
  <option value="1200x1200">1200 × 1200 (Square)</option>
</select>

<button onclick="generateImage()">Download Image</button>

</div>

<canvas id="canvas"></canvas>

</div>

<script>
function slugify(text) {
  return text.toLowerCase()
    .replace(/[^a-z0-9 ]/g, '')
    .replace(/\s+/g, '-')
    .trim();
}

function generateImage() {
  const title = document.getElementById("title").value;
  const quote = document.getElementById("quote").value;
  const size = document.getElementById("size").value;
  const file = document.getElementById("bgImage").files[0];

  if (!title || !quote || !file) {
    alert("Please fill all fields");
    return;
  }

  const [w, h] = size.split("x");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = w;
  canvas.height = h;

  const img = new Image();
  img.onload = function () {
    ctx.drawImage(img, 0, 0, w, h);

    // Dark overlay for readability
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(0, 0, w, h);

    // Quote text
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.font = "bold 48px Arial";

    wrapText(ctx, quote, w / 2, h / 2, w - 100, 60);

    // Download
    const link = document.createElement("a");
    link.download = slugify(title) + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  };

  img.src = URL.createObjectURL(file);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let lines = [];

  for (let n = 0; n < words.length; n++) {
    let testLine = line + words[n] + " ";
    let metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && n > 0) {
      lines.push(line);
      line = words[n] + " ";
    } else {
      line = testLine;
    }
  }
  lines.push(line);

  y -= (lines.length - 1) * lineHeight / 2;
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x, y);
    y += lineHeight;
  }
}
</script>

</body>
</html>
