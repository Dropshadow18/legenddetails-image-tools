<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Premium Quote Image Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  background: #0f172a;
  color: #fff;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-weight: 600;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

textarea, input, select, button {
  padding: 10px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
}

textarea {
  min-height: 120px;
}

button {
  background: #facc15;
  cursor: pointer;
  font-weight: 600;
}

.preview-box {
  background: #000;
  display: flex;
  justify-content: center;
  padding: 20px;
}

canvas {
  width: 100%;
  max-width: 800px;
  border-radius: 12px;
}
</style>
</head>

<body>
<div class="container">

<h1>Premium Quote Image Studio</h1>

<div class="controls">
  <textarea id="quoteText" placeholder="Enter quote (English / Telugu)"></textarea>

  <input id="highlightWord" placeholder="Highlight word (optional)">

  <select id="language">
    <option value="en">English</option>
    <option value="te">Telugu</option>
  </select>

  <select id="highlightColor">
    <option value="#d4af37">Gold</option>
    <option value="#ffffff">White</option>
    <option value="#ef4444">Soft Red</option>
  </select>

  <button onclick="renderQuote()">Preview</button>
  <button onclick="downloadImage()">Download Image</button>
</div>

<div class="preview-box">
  <canvas id="quoteCanvas" width="1200" height="1200"></canvas>
</div>

</div>

<script>
const canvas = document.getElementById("quoteCanvas");
const ctx = canvas.getContext("2d");

function renderQuote() {
  const text = document.getElementById("quoteText").value;
  const highlight = document.getElementById("highlightWord").value.trim();
  const lang = document.getElementById("language").value;
  const highlightColor = document.getElementById("highlightColor").value;

  // Background
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, "#020617");
  gradient.addColorStop(1, "#020617dd");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Font
  ctx.textAlign = "center";
  ctx.fillStyle = "#f8fafc";
  ctx.font = lang === "te"
    ? "48px 'Noto Serif Telugu'"
    : "48px 'Playfair Display'";

  const lines = text.split("\n");
  let y = 380;

  lines.forEach(line => {
    if (highlight && line.includes(highlight)) {
      const parts = line.split(highlight);

      ctx.fillText(parts[0], canvas.width / 2, y);

      ctx.fillStyle = highlightColor;
      ctx.font = lang === "te"
        ? "64px 'Noto Serif Telugu'"
        : "64px 'Playfair Display'";
      ctx.fillText(highlight, canvas.width / 2, y + 65);

      ctx.fillStyle = "#f8fafc";
      ctx.font = lang === "te"
        ? "48px 'Noto Serif Telugu'"
        : "48px 'Playfair Display'";
      ctx.fillText(parts[1] || "", canvas.width / 2, y + 120);

      y += 180;
    } else {
      ctx.fillText(line, canvas.width / 2, y);
      y += 70;
    }
  });

  // Footer
  ctx.font = "20px Arial";
  ctx.globalAlpha = 0.4;
  ctx.fillText("LegendDetails", canvas.width / 2, canvas.height - 60);
  ctx.globalAlpha = 1;
}

function downloadImage() {
  const link = document.createElement("a");
  link.download = "premium-quote.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

renderQuote();
</script>

</body>
</html>
