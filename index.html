<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Premium Quote Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  background: #020617;
  color: #fff;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}
h1 {
  text-align: center;
  margin-bottom: 20px;
}
.controls {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
}
textarea, select, button, input[type="file"] {
  padding: 10px;
  border-radius: 6px;
  border: none;
}
textarea { min-height: 130px; }
button { background: #facc15; font-weight: 600; cursor: pointer; }

.preview-wrap {
  display: flex;
  justify-content: center;
  margin-top: 25px;
}

/* ===== QUOTE BOX ===== */
.preview {
  width: 900px;
  aspect-ratio: 1/1;
  padding: 80px;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  box-sizing: border-box;
  position: relative;
  overflow: hidden;
}

/* Background image overlay */
.preview::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--bg-image);
  background-size: cover;
  background-position: center;
  opacity: 0.45;
  z-index: 0;
}

.preview > * {
  position: relative;
  z-index: 1;
}

.quote-line {
  margin-bottom: 28px;
  line-height: 1.3;
  word-break: break-word;
}

.word { font-size: 56px; font-family: 'Playfair Display', serif; }
.highlight { font-size: 92px; font-weight: 600; }

/* Telugu font */
.telugu .word, .telugu .highlight { font-family: 'Noto Serif Telugu', serif; }

/* Footer */
.footer { margin-top: auto; font-size: 18px; opacity: 0.4; }

/* ===== PRESETS ===== */
.calm { background: #020617; }
.calm .highlight { color: #d4af37; }

.bold { background: #020617; }
.bold .highlight { color: #ef4444; font-size: 100px; }

.spiritual { background: linear-gradient(180deg,#020617,#041b2d); }
.spiritual .highlight { color: #a5f3fc; }

.royal { background: linear-gradient(180deg,#1e0038,#020617); }
.royal .highlight { color: #c084fc; font-size: 96px; }

.sunset { background: linear-gradient(180deg,#3b0a0a,#020617); }
.sunset .highlight { color: #fb923c; }

.ocean { background: linear-gradient(180deg,#041f2d,#020617); }
.ocean .highlight { color: #38bdf8; }

.mono { background: #000; }
.mono .word { color: #e5e7eb; }
.mono .highlight { color: #fff; font-size: 80px; text-decoration: underline; }

.neon { background: #020617; }
.neon .highlight { color: #22d3ee; font-size: 98px; text-shadow: 0 0 6px #22d3ee, 0 0 14px #22d3ee; }

/* ===== IMAGE MODE ===== */
.image-mode { background: #000 !important; }
.image-mode::before { opacity: 0.55 !important; }
.image-mode .word { text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
.image-mode .highlight { text-shadow: 0 2px 10px rgba(0,0,0,0.9); }

/* ===== BORDER STYLES ===== */
.rounded { border-radius: 18px; }
.circle { border-radius: 50%; }
.shadow { box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
.outline { border: 5px solid #facc15; }
</style>
</head>
<body>
<div class="container">

<h1>Premium Quote Image Studio</h1>

<div class="controls">
  <textarea id="quoteText" placeholder="Paste quote here..."></textarea>

  <select id="language">
    <option value="en">English</option>
    <option value="te">Telugu</option>
  </select>

  <select id="preset">
    <option value="calm">Calm Wisdom</option>
    <option value="bold">Bold Motivation</option>
    <option value="spiritual">Soft Spiritual</option>
    <option value="royal">Royal Purple</option>
    <option value="sunset">Sunset Glow</option>
    <option value="ocean">Ocean Blue</option>
    <option value="mono">Minimal Mono</option>
    <option value="neon">Dark Neon</option>
  </select>

  <input type="file" id="bgImage" accept="image/*" onchange="setBackgroundImage(event)">
  <button onclick="clearBackground()">Remove Image</button>

  <select id="imageSize">
    <option value="square">Square (1:1)</option>
    <option value="portrait">Portrait (4:5)</option>
    <option value="landscape">Landscape (16:9)</option>
  </select>

  <select id="borderStyle">
    <option value="rounded">Rounded</option>
    <option value="circle">Circle</option>
    <option value="shadow">Shadow</option>
    <option value="outline">Outline</option>
  </select>

  <select id="fontType">
    <option value="Playfair Display">Playfair Display</option>
    <option value="Arial, sans-serif">Sans-serif</option>
    <option value="Noto Serif Telugu">Noto Serif Telugu</option>
  </select>

  <select id="fontSize">
    <option value="small">Small</option>
    <option value="medium" selected>Medium</option>
    <option value="large">Large</option>
  </select>

  <button onclick="renderQuote()">Preview</button>
  <button onclick="downloadImage()">Download</button>
</div>

<div class="preview-wrap">
  <div id="preview" class="preview calm rounded"></div>
</div>

</div>

<script>
let bgImageURL = "";

function renderQuote() {
  const text = document.getElementById("quoteText").value.trim();
  const preset = document.getElementById("preset").value;
  const lang = document.getElementById("language").value;
  const preview = document.getElementById("preview");

  preview.className = `preview ${preset} ${lang==='te'?'telugu':''}`;

  // Apply image mode
  if(bgImageURL) preview.classList.add("image-mode");

  // Apply border style
  const borderStyle = document.getElementById("borderStyle").value;
  preview.classList.add(borderStyle);

  // Set image size
  const size = document.getElementById("imageSize").value;
  if(size==='square'){ preview.style.width='900px'; preview.style.aspectRatio='1/1'; }
  if(size==='portrait'){ preview.style.width='900px'; preview.style.aspectRatio='4/5'; }
  if(size==='landscape'){ preview.style.width='1280px'; preview.style.aspectRatio='16/9'; }

  // Clear previous text
  preview.innerHTML='';

  if(!text) return;

  const fontType = document.getElementById("fontType").value;
  const fontSize = document.getElementById("fontSize").value;
  let wordSize=56, highlightSize=92;
  if(fontSize==='small'){ wordSize=40; highlightSize=70; }
  if(fontSize==='medium'){ wordSize=56; highlightSize=92; }
  if(fontSize==='large'){ wordSize=72; highlightSize=110; }

  const lines = text.split("\n");
  lines.forEach(line=>{
    const words=line.split(" ");
    const highlightIndex=Math.floor(words.length/2);
    const lineDiv=document.createElement("div");
    lineDiv.className="quote-line";
    words.forEach((word,i)=>{
      const span=document.createElement("span");
      span.textContent=word+" ";
      span.style.fontFamily=fontType;
      span.style.fontSize=(i===highlightIndex?highlightSize:wordSize)+"px";
      span.className=i===highlightIndex?"highlight":"word";
      lineDiv.appendChild(span);
    });
    preview.appendChild(lineDiv);
  });

  const footer=document.createElement("div");
  footer.className="footer";
  footer.textContent="LegendDetails";
  preview.appendChild(footer);
}

function setBackgroundImage(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    bgImageURL=reader.result;
    const preview=document.getElementById("preview");
    preview.style.setProperty("--bg-image", `url(${bgImageURL})`);
    preview.classList.add("image-mode");
  };
  reader.readAsDataURL(file);
}

function clearBackground(){
  bgImageURL="";
  const preview=document.getElementById("preview");
  preview.style.setProperty("--bg-image","none");
  preview.classList.remove("image-mode");
}

function downloadImage(){
  html2canvas(document.getElementById("preview"),{scale:2,backgroundColor:null}).then(canvas=>{
    const link=document.createElement("a");
    link.download="legenddetails-quote.png";
    link.href=canvas.toDataURL("image/png");
    link.click();
  });
}

renderQuote();
</script>

</body>
</html>
