<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LegendDetails Quote Image Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins&family=Montserrat&family=Playfair+Display&family=Lato&family=Noto+Sans+Telugu&family=Noto+Sans+Devanagari&family=Noto+Sans+Tamil&family=Noto+Sans+Kannada&display=swap" rel="stylesheet">

<style>
body{font-family:Arial;background:#eef1f5}
.container{max-width:1200px;margin:auto;padding:20px}
.tool{background:#fff;padding:20px;border-radius:10px}
label{font-weight:bold;margin-top:10px;display:block}
input,textarea,select{width:100%;padding:8px;margin-top:5px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1}
#preview{max-width:100%;border:2px solid #ccc;margin-top:15px}
canvas{display:none}
</style>
</head>

<body>
<div class="container">
<h1>LegendDetails – Quote Image Studio</h1>

<div class="tool">

<label>Post Title</label>
<input id="title">

<label>Background Image</label>
<input type="file" id="bg" accept="image/*">

<label>Quote Language</label>
<select id="language" onchange="loadFonts()">
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
</select>

<label>Quote Text (ENTER = New Line)</label>
<textarea id="quote" rows="4"></textarea>

<label>Font Style</label>
<select id="font"></select>

<div class="row">
<div>
<label>Text Size</label>
<input type="range" id="textSize" min="16" max="72" value="42">
</div>
<div>
<label>Line Gap</label>
<input type="range" id="lineGap" min="20" max="120" value="60">
</div>
</div>

<label>Text Style</label>
<input type="checkbox" id="bold"> Bold
<input type="checkbox" id="italic"> Italic

<label>Text Color</label>
<input type="color" id="color" value="#ffffff">

<label>Text Shadow</label>
<select id="shadow">
<option value="none">None</option>
<option value="soft">Soft</option>
<option value="strong">Strong</option>
<option value="glow">Glow</option>
</select>

<label>Text Outline</label>
<input type="checkbox" id="outline"> Enable Outline
<input type="color" id="outlineColor" value="#000000">

<label>Text Alignment</label>
<select id="align">
<option value="center">Center</option>
<option value="left">Left</option>
<option value="right">Right</option>
</select>

<label>Vertical Position</label>
<select id="vertical">
<option value="middle">Middle</option>
<option value="top">Top</option>
<option value="bottom">Bottom</option>
</select>

<label>Image Size</label>
<select id="size">
<option value="1200x675">1200×675</option>
<option value="1600x900">1600×900</option>
<option value="2400x1350">2400×1350</option>
</select>

<button onclick="download()">Download JPG</button>

<h3>Live Preview</h3>
<img id="preview">

</div>
<canvas id="canvas"></canvas>
</div>

<script>
const fontMap={
en:["Poppins","Montserrat","Playfair Display","Lato"],
te:["Noto Sans Telugu"],
hi:["Noto Sans Devanagari"],
ta:["Noto Sans Tamil"],
kn:["Noto Sans Kannada"]
};

function loadFonts(){
font.innerHTML="";
fontMap[language.value].forEach(f=>{
const o=document.createElement("option");
o.value=f; o.textContent=f;
font.appendChild(o);
});
}
loadFonts();

document.querySelectorAll("input,textarea,select").forEach(e=>e.oninput=render);

function render(){
if(!bg.files[0]) return;

const [w,h]=size.value.split("x");
canvas.width=w; canvas.height=h;
const ctx=canvas.getContext("2d");

const img=new Image();
img.onload=()=>{
ctx.drawImage(img,0,0,w,h);

// font style
let style="";
if(bold.checked) style+="bold ";
if(italic.checked) style+="italic ";
style+=`${textSize.value}px ${font.value}`;
ctx.font=style;
ctx.fillStyle=color.value;
ctx.textAlign=align.value;

// shadow
ctx.shadowColor="transparent";
if(shadow.value==="soft"){
ctx.shadowColor="rgba(0,0,0,0.5)";
ctx.shadowBlur=10;
}
if(shadow.value==="strong"){
ctx.shadowColor="rgba(0,0,0,0.8)";
ctx.shadowBlur=15;
}
if(shadow.value==="glow"){
ctx.shadowColor=color.value;
ctx.shadowBlur=20;
}

// line height safety
const lineHeight=Math.max(lineGap.value, textSize.value*1.3);
const lines=buildLines(ctx,quote.value,w-200);
const blockHeight=lines.length*lineHeight;

let y;
if(vertical.value==="top") y=120;
else if(vertical.value==="bottom") y=h-blockHeight-120;
else y=(h-blockHeight)/2;

const x=align.value==="left"?100:align.value==="right"?w-100:w/2;

// outline first
if(outline.checked){
ctx.lineWidth=Math.max(2, textSize.value/10);
ctx.strokeStyle=outlineColor.value;
lines.forEach(line=>{
ctx.strokeText(line,x,y);
y+=lineHeight;
});
y-=(lines.length*lineHeight);
}

// fill text
lines.forEach(line=>{
ctx.fillText(line,x,y);
y+=lineHeight;
});

// watermark
ctx.shadowBlur=0;
ctx.font="20px Poppins";
ctx.fillStyle="rgba(255,255,255,0.7)";
ctx.textAlign="right";
ctx.fillText("LegendDetails.BlogSpot.Com",w-20,40);

preview.src=canvas.toDataURL("image/jpeg",0.95);
};
img.src=URL.createObjectURL(bg.files[0]);
}

function buildLines(ctx,text,maxWidth){
const paragraphs=text.split("\n");
let lines=[];
paragraphs.forEach(p=>{
let words=p.split(" ");
let line="";
words.forEach(w=>{
let test=line+w+" ";
if(ctx.measureText(test).width>maxWidth && line){
lines.push(line);
line=w+" ";
}else{
line=test;
}
});
lines.push(line);
});
return lines;
}

function download(){
const a=document.createElement("a");
a.download=title.value.replace(/\s+/g,"-").toLowerCase()+".jpg";
a.href=canvas.toDataURL("image/jpeg",0.95);
a.click();
}
</script>
</body>
</html>
