<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails Quote Image Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?
family=Poppins:wght@400;700&family=Montserrat:wght@400;700&
family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&
family=Raleway:wght@400;700&family=Roboto:wght@400;700&
family=Oswald:wght@400;700&family=Merriweather:wght@400;700&
family=Ubuntu:wght@400;700&family=Arial:wght@400;700&
family=Noto+Sans+Telugu:wght@400;700&family=Noto+Serif+Telugu:wght@400;700&
family=Pothana:wght@400;700&family=Gidugu:wght@400;700&
family=NTR:wght@400;700&family=Baloo+Tamma:wght@400;700&
family=Noto+Sans+Devanagari:wght@400;700&family=Hind:wght@400;700&
family=Karma:wght@400;700&family=Rajdhani:wght@400;700&
family=Noto+Sans+Tamil:wght@400;700&family=Noto+Serif+Tamil:wght@400;700&
family=Catamaran:wght@400;700&family=Baloo+Tammudu:wght@400;700&
family=Varela+Round:wght@400;700&family=Noto+Sans+Kannada:wght@400;700&
family=Noto+Serif+Kannada:wght@400;700&family=TiroKannada:wght@400;700&
family=Baloo+Da:wght@400;700&family=Gubbi:wght@400;700&display=swap" rel="stylesheet">

<style>
body{font-family:Poppins;background:#eef1f5;margin:0;padding:0}
.container{max-width:1200px;margin:auto;padding:20px}
.tool{background:#fff;padding:20px;border-radius:10px}
label{font-weight:bold;margin-top:10px;display:block}
input,textarea,select{width:100%;padding:8px;margin-top:5px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1}
#preview{max-width:100%;border:2px solid #ccc;margin-top:15px}
canvas{display:none}
</style>
</head>

<body>
<div class="container">
<h1>LegendDetails – Quote Image Studio</h1>

<div class="tool">

<label>Post Title</label>
<input id="title">

<label>Upload Background Image</label>
<input type="file" id="bg" accept="image/*">

<label>Quote Language</label>
<select id="language" onchange="loadFonts()">
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
</select>

<label>Quote Text (ENTER = New Line)</label>
<textarea id="quote" rows="4"></textarea>

<label>Font Style (Preview)</label>
<select id="font"></select>

<div class="row">
<div>
<label>Text Size</label>
<input type="range" id="textSize" min="16" max="300" value="42">
</div>
<div>
<label>Line Gap</label>
<input type="range" id="lineGap" min="20" max="150" value="60">
</div>
</div>

<label>Text Style</label>
<input type="checkbox" id="bold"> Bold
<input type="checkbox" id="italic"> Italic

<label>Text Color</label>
<input type="color" id="color" value="#ffffff">

<label>Text Shadow</label>
<select id="shadow">
<option value="none">None</option>
<option value="soft">Soft</option>
<option value="strong">Strong</option>
<option value="glow">Glow</option>
</select>

<label>Text Outline</label>
<input type="checkbox" id="outline"> Enable Outline
<input type="color" id="outlineColor" value="#000000">

<label>Text Alignment</label>
<select id="align">
<option value="center">Center</option>
<option value="left">Left</option>
<option value="right">Right</option>
</select>

<label>Vertical Position</label>
<select id="vertical">
<option value="middle">Middle</option>
<option value="top">Top</option>
<option value="bottom">Bottom</option>
</select>

<label>Image Size (SEO Optimized)</label>
<select id="size">
  <option value="1200x675">Standard Blog Post - 1200×675</option>
  <option value="1600x900">Large Header - 1600×900</option>
  <option value="2400x1350">High Quality - 2400×1350</option>
  <option value="800x450">Thumbnail - 800×450</option>
  <option value="1080x1920">Pinterest Vertical - 1080×1920</option>
</select>

<label>Image Border Color</label>
<input type="color" id="borderColor" value="#000000">

<label>Border Style</label>
<select id="borderStyle">
<option value="solid">Solid</option>
<option value="dashed">Dashed</option>
<option value="dotted">Dotted</option>
<option value="double">Double</option>
</select>

<button onclick="download()">Download JPG</button>

<h3>Live Preview</h3>
<img id="preview">

</div>
<canvas id="canvas"></canvas>
</div>

<script>
// Font mapping – 10+ per language
const fontMap={
en:["Poppins","Montserrat","Playfair Display","Lato","Raleway","Roboto","Oswald","Merriweather","Ubuntu","Arial"],
te:["Noto Sans Telugu","Noto Serif Telugu","Pothana","Gidugu","NTR","Baloo Tamma","NTR","Gidugu","Pothana","Noto Sans Telugu"],
hi:["Noto Sans Devanagari","Hind","Poppins","Karma","Roboto","Rajdhani","Hind","Karma","Rajdhani","Noto Sans Devanagari"],
ta:["Noto Sans Tamil","Noto Serif Tamil","Catamaran","Baloo Tammudu","Varela Round","Catamaran","Baloo Tammudu","Varela Round","Noto Sans Tamil","Noto Serif Tamil"],
kn:["Noto Sans Kannada","Noto Serif Kannada","TiroKannada","Baloo Da","Gubbi","Baloo Da","Gubbi","Noto Sans Kannada","Noto Serif Kannada","TiroKannada"]
};

// Populate font dropdown with preview
function loadFonts(){
  font.innerHTML="";
  fontMap[language.value].forEach(f=>{
    const o=document.createElement("option");
    o.value=f; o.textContent=f;
    o.style.fontFamily=f; // font preview
    font.appendChild(o);
  });
}
loadFonts();

// Trigger render on any input
document.querySelectorAll("input,textarea,select").forEach(e=>e.oninput=render);

// Main render function
function render(){
  if(!bg.files[0]) return;

  const [w,h]=size.value.split("x");
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext("2d");

  const img=new Image();
  img.onload=()=>{
    ctx.drawImage(img,0,0,w,h);

    // Border
    ctx.lineWidth=10;
    ctx.strokeStyle=borderColor.value;
    const style=borderStyle.value;
    ctx.setLineDash(style==="dashed"?[20,10]:style==="dotted"?[5,5]:style==="double"?[10,0]:[]);
    ctx.strokeRect(0,0,w,h);

    // Font style
    let fs="";
    if(bold.checked) fs+="bold ";
    if(italic.checked) fs+="italic ";
    fs+=`${textSize.value}px ${font.value}`;
    ctx.font=fs;
    ctx.fillStyle=color.value;
    ctx.textAlign=align.value;

    // Shadow
    ctx.shadowColor="transparent"; ctx.shadowBlur=0;
    if(shadow.value==="soft"){ ctx.shadowColor="rgba(0,0,0,0.5)"; ctx.shadowBlur=10; }
    if(shadow.value==="strong"){ ctx.shadowColor="rgba(0,0,0,0.8)"; ctx.shadowBlur=16; }
    if(shadow.value==="glow"){ ctx.shadowColor=color.value; ctx.shadowBlur=20; }

    // Line height
    const lineHeight=Math.max(lineGap.value, textSize.value*1.3);
    const lines=wrapText(ctx,quote.value,w-200);
    const blockHeight=lines.length*lineHeight;

    // Vertical position
    let y;
    if(vertical.value==="top") y=120;
    else if(vertical.value==="bottom") y=h-blockHeight-120;
    else y=(h-blockHeight)/2;

    const x=align.value==="left"?100:align.value==="right"?w-100:w/2;

    // Outline
    if(outline.checked){
      ctx.lineWidth=Math.max(2,textSize.value/10);
      ctx.strokeStyle=outlineColor.value;
      let oy=y;
      lines.forEach(l=>{
        ctx.strokeText(l,x,oy);
        oy+=lineHeight;
      });
    }

    // Fill text
    lines.forEach(l=>{
      ctx.fillText(l,x,y);
      y+=lineHeight;
    });

    // Watermark
    ctx.shadowBlur=0;
    ctx.font="20px Poppins";
    ctx.fillStyle="rgba(255,255,255,0.7)";
    ctx.textAlign="right";
    ctx.fillText("LegendDetails.BlogSpot.Com",w-20,40);

    preview.src=canvas.toDataURL("image/jpeg",0.95);
  };
  img.src=URL.createObjectURL(bg.files[0]);
}

// Wrap text & preserve line breaks
function wrapText(ctx,text,maxWidth){
  const paragraphs=text.split("\n");
  let lines=[];
  paragraphs.forEach(p=>{
    let words=p.split(" ");
    let line="";
    words.forEach(w=>{
      let test=line+w+" ";
      if(ctx.measureText(test).width>maxWidth && line){
        lines.push(line);
        line=w+" ";
      }else{ line=test; }
    });
    lines.push(line);
  });
  return lines;
}

// Download JPG
function download(){
  const a=document.createElement("a");
  a.download=title.value.replace(/\s+/g,"-").toLowerCase()+".jpg";
  a.href=canvas.toDataURL("image/jpeg",0.95);
  a.click();
}
</script>
</body>
</html>
