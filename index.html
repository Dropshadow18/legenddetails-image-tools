<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails Quote Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&family=Noto+Serif+Telugu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Noto+Sans+Kannada:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial;}
.container{max-width:1200px;margin:auto;padding:20px;}
h1{text-align:center;margin-bottom:15px;}

.controls{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
textarea,select,input,button{padding:10px;border-radius:6px;border:none;}
textarea{min-height:120px;}
button{background:#facc15;font-weight:600;cursor:pointer;}

.presets{
display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;
}
.preset-btn{
background:#111827;color:#fff;border:1px solid #334155;
padding:8px 12px;border-radius:20px;cursor:pointer;font-size:13px;
}
.preset-btn:hover{background:#facc15;color:#000;}

.preview-wrap{display:flex;justify-content:center;margin-top:25px;}
.preview{
width:1024px;
aspect-ratio:16/9;
padding:80px;
border-radius:18px;
display:flex;
flex-direction:column;
justify-content:center;
text-align:center;
position:relative;
overflow:hidden;
background:#111;
}
.preview::before{
content:"";
position:absolute;inset:0;
background-image:var(--bg-image);
background-size:cover;background-position:center;
opacity:0.45;z-index:0;
}
.preview>*{position:relative;z-index:1;}
.quote-line{margin-bottom:25px;line-height:1.3;word-break:break-word;}
.highlight{font-weight:700;}

.watermark{
position:absolute;top:15px;right:20px;
font-family:'Playfair Display',serif;
font-size:20px;color:rgba(255,255,255,0.45);
}
</style>
</head>

<body>
<div class="container">
<h1>LegendDetails Quote Studio</h1>

<!-- PRESET BUTTONS -->
<div class="presets">
<button class="preset-btn" onclick="setPreset('success')">Success</button>
<button class="preset-btn" onclick="setPreset('motivation')">Motivation</button>
<button class="preset-btn" onclick="setPreset('life')">Life</button>
<button class="preset-btn" onclick="setPreset('money')">Money</button>
<button class="preset-btn" onclick="setPreset('attitude')">Attitude</button>
<button class="preset-btn" onclick="setPreset('telugu')">Telugu</button>
<button class="preset-btn" onclick="setPreset('hindi')">Hindi</button>
<button class="preset-btn" onclick="setPreset('tamil')">Tamil</button>
</div>

<div class="controls">

<textarea id="quoteText" placeholder="Type or use presets..." oninput="renderQuote()"></textarea>

<select id="language" oninput="renderQuote()">
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
</select>

<select id="fontType" oninput="renderQuote()">
<option value="Playfair Display">Playfair</option>
<option value="Roboto Slab">Roboto Slab</option>
<option value="Arial">Arial</option>
</select>

<input type="number" id="wordSize" value="58" min="10" max="300" oninput="renderQuote()">
<input type="number" id="highlightSize" value="90" min="10" max="300" oninput="renderQuote()">

<input type="color" id="highlightColor" value="#facc15" oninput="renderQuote()">

<input type="file" id="bgImage" accept="image/*" onchange="setBackgroundImage(event)">

<select id="imageSize" oninput="renderQuote()">
<option value="landscape">Blog 1024×675</option>
<option value="square">Square 1200×1200</option>
<option value="portrait">Pinterest 900×1125</option>
</select>

<input type="text" id="imageName" value="legenddetails-quote">

<button onclick="downloadImage()">Download JPG</button>

</div>

<div class="preview-wrap">
<div class="preview" id="preview">
<div class="watermark">LegendDetails.Blogspot.Com</div>
</div>
</div>
</div>

<script>
let bgImageURL="";

const langFonts={
en:null,
te:"Noto Serif Telugu",
hi:"Noto Sans Devanagari",
ta:"Noto Sans Tamil",
kn:"Noto Sans Kannada"
};

function setPreset(type){
const presets={
success:"Success starts when excuses stop",
motivation:"Push yourself because no one else will",
life:"Life becomes beautiful when mindset changes",
money:"Smart work builds wealth faster than hard work",
attitude:"Your attitude decides your direction",
telugu:"జీవితం మారాలంటే ఆలోచనలు మారాలి",
hindi:"सफलता सोच बदलने से शुरू होती है",
tamil:"வாழ்க்கை எண்ணம் மாறும் போது மாறும்"
};
quoteText.value=presets[type];
renderQuote();
}

function renderQuote(){
const text=quoteText.value.trim();
const preview=document.getElementById("preview");
const lang=language.value;

let width=1024,ar='16/9';
if(imageSize.value==='square'){width=1200;ar='1/1'}
if(imageSize.value==='portrait'){width=900;ar='4/5'}
preview.style.width=width+'px';
preview.style.aspectRatio=ar;

preview.innerHTML='<div class="watermark">LegendDetails.Blogspot.Com</div>';
if(!text) return;

const font=langFonts[lang]||fontType.value;
const lines=text.split("\n");

lines.forEach(line=>{
const words=line.split(" ");
const hi=Math.floor(words.length/2);
const div=document.createElement("div");
div.className="quote-line";

words.forEach((w,i)=>{
const s=document.createElement("span");
s.textContent=w+" ";
s.style.fontFamily=font;
s.style.fontSize=(i===hi?highlightSize.value:wordSize.value)+"px";
s.style.color=i===hi?highlightColor.value:"#fff";
if(i===hi)s.className="highlight";
div.appendChild(s);
});
preview.appendChild(div);
});
}

function setBackgroundImage(e){
const r=new FileReader();
r.onload=()=>{
bgImageURL=r.result;
preview.style.setProperty("--bg-image",`url(${bgImageURL})`);
renderQuote();
}
r.readAsDataURL(e.target.files[0]);
}

function downloadImage(){
const name=imageName.value||"legenddetails-quote";
html2canvas(preview,{scale:2,backgroundColor:"#000"}).then(c=>{
const a=document.createElement("a");
a.download=name+".jpg";
a.href=c.toDataURL("image/jpeg",0.95);
a.click();
});
}

renderQuote();
</script>
</body>
</html>
