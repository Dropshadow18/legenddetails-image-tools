<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Image Studio Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Noto+Sans+Telugu&family=Noto+Sans+Devanagari&family=Noto+Sans+Tamil&family=Noto+Sans+Kannada&display=swap" rel="stylesheet">

<style>
body{
font-family:Poppins,sans-serif;
background:#f4f4f4;
text-align:center;
margin:0;
padding:0;
}
.container{
width:92%;
max-width:700px;
margin:auto;
padding:20px;
}
textarea{
width:100%;
height:110px;
padding:12px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
resize:none;
}
input,select,button{
margin-top:10px;
padding:10px;
font-size:16px;
border-radius:8px;
border:none;
}
button{
background:#000;
color:#fff;
cursor:pointer;
}
canvas{
margin-top:20px;
width:100%;
max-width:600px;
border-radius:16px;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
}
</style>
</head>

<body>
<div class="container">

<h2>Quote Image Studio</h2>

<textarea id="quote" placeholder="Type quote in any language..."></textarea><br>

<input type="file" id="bgUpload" accept="image/*"><br>

<select id="sizeSelect">
<option value="blogger">Blogger Size (1000x1000)</option>
<option value="pinterest">Pinterest Size (1000x1500)</option>
</select><br>

<input type="text" id="imgName" placeholder="Enter image name"><br>

<button onclick="generate()">Generate</button>
<button onclick="download()">Download JPG</button>

<br>
<canvas id="canvas" width="1000" height="1000"></canvas>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function setSize(){
let size=document.getElementById("sizeSelect").value;
if(size==="pinterest"){
canvas.width=1000;
canvas.height=1500;
}else{
canvas.width=1000;
canvas.height=1000;
}
}

function getFont(text){
if(/[ఀ-౿]/.test(text)) return "bold 60px Noto Sans Telugu";
if(/[ऀ-ॿ]/.test(text)) return "bold 60px Noto Sans Devanagari";
if(/[஀-௿]/.test(text)) return "bold 60px Noto Sans Tamil";
if(/[೦-೿]/.test(text)) return "bold 60px Noto Sans Kannada";
return "bold 64px Poppins";
}

function generate(){
setSize();

let text=document.getElementById("quote").value;
let file=document.getElementById("bgUpload").files[0];

if(file){
let reader=new FileReader();
reader.onload=function(e){
let img=new Image();
img.onload=function(){
ctx.drawImage(img,0,0,canvas.width,canvas.height);
drawText(text);
};
img.src=e.target.result;
};
reader.readAsDataURL(file);
}else{
let grad=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
grad.addColorStop(0,"#ff512f");
grad.addColorStop(1,"#dd2476");
ctx.fillStyle=grad;
ctx.fillRect(0,0,canvas.width,canvas.height);
drawText(text);
}
}

function drawText(text){
ctx.textAlign="center";
ctx.fillStyle="#fff";
ctx.font=getFont(text);

let words=text.split(" ");
let line="";
let lines=[];
let maxWidth=canvas.width*0.8;

for(let n=0;n<words.length;n++){
let testLine=line+words[n]+" ";
let metrics=ctx.measureText(testLine);
if(metrics.width>maxWidth && n>0){
lines.push(line);
line=words[n]+" ";
}else{
line=testLine;
}
}
lines.push(line);

let lineHeight=70;
let y=canvas.height/2-(lines.length/2)*lineHeight;

for(let i=0;i<lines.length;i++){
ctx.fillStyle=i%3==0?"#ffffff":i%3==1?"#ffe600":"#00ffd5";
ctx.fillText(lines[i],canvas.width/2,y);
y+=lineHeight;
}
}

function download(){
let name=document.getElementById("imgName").value || "quote-image";
let link=document.createElement("a");
link.download=name+".jpg";
link.href=canvas.toDataURL("image/jpeg",1.0);
link.click();
}
</script>

</body>
</html>
