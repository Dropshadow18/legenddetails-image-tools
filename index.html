<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails Quote Image Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; }
.container { max-width:1100px; margin:auto; padding:20px; }
.tool { background:#fff; padding:20px; margin-bottom:20px; border-radius:8px; }
label { font-weight:bold; display:block; margin-top:10px; }
input, textarea, select { width:100%; padding:8px; margin-top:5px; }
.row { display:flex; gap:10px; flex-wrap:wrap; }
.row div { flex:1; }
.colors span {
  width:26px; height:26px; display:inline-block;
  cursor:pointer; border:1px solid #000; margin:2px;
}
button {
  margin-top:15px; padding:12px 20px;
  background:#007bff; color:#fff;
  border:none; font-size:16px; cursor:pointer;
}
#preview { max-width:100%; margin-top:15px; border:2px solid #ccc; display:none; }
canvas { display:none; }
</style>
</head>

<body>
<div class="container">
<h1>LegendDetails – Quote Image Tool</h1>

<div class="tool">

<label>1. Post Title</label>
<input id="title">

<label>2. Upload Background Image</label>
<input type="file" id="bg" accept="image/*">

<label>3. Quote Text (Any Language)</label>
<textarea id="quote" rows="4"></textarea>

<label>4. Font Style</label>
<select id="font">
  <option>Arial</option>
  <option>Georgia</option>
  <option>Times New Roman</option>
  <option>Verdana</option>
</select>

<label>5. Text Alignment</label>
<div class="row">
  <div>
    <select id="align">
      <option value="center">Center</option>
      <option value="left">Left</option>
      <option value="right">Right</option>
    </select>
  </div>
  <div>
    <select id="vertical">
      <option value="middle">Middle</option>
      <option value="top">Top</option>
      <option value="bottom">Bottom</option>
    </select>
  </div>
</div>

<label>6. Text Style</label>
<input type="checkbox" id="bold"> Bold
<input type="checkbox" id="italic"> Italic

<label>7. Text Color</label>
<div class="colors" id="colors"></div>

<label>8. Image Border</label>
<select id="border">
  <option value="none">None</option>
  <option value="white">White</option>
  <option value="black">Black</option>
</select>

<label>9. Image Effect</label>
<select id="effect">
  <option value="none">None</option>
  <option value="grayscale(1)">Grayscale</option>
  <option value="blur(2px)">Blur</option>
</select>

<label>10. Image Size</label>
<select id="size">
  <option value="1200x675">1200×675</option>
  <option value="1600x900">1600×900</option>
  <option value="2400x1350">2400×1350</option>
</select>

<button onclick="generatePreview()">Preview Image</button>
<button onclick="downloadImage()" id="downloadBtn" style="display:none;">
Download Image
</button>

<h3>Preview</h3>
<img id="preview">

</div>

<canvas id="canvas"></canvas>
</div>

<script>
const colorList = ["#ffffff","#000000","#ff0000","#00ff00","#0000ff","#ffff00","#ff00ff","#00ffff"];
let textColor = "#ffffff";
let finalImage = "";

const colors = document.getElementById("colors");
colorList.forEach(c=>{
  const s=document.createElement("span");
  s.style.background=c;
  s.onclick=()=>textColor=c;
  colors.appendChild(s);
});

function slugify(t){
  return t.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g,"-");
}

function generatePreview(){
  generate(true);
}

function downloadImage(){
  const a=document.createElement("a");
  a.download=slugify(title.value)+".png";
  a.href=finalImage;
  a.click();
}

function generate(){
  if(!title.value || !quote.value || !bg.files[0]){
    alert("Please fill all fields");
    return;
  }

  const [w,h]=size.value.split("x");
  const canvas=document.getElementById("canvas");
  const ctx=canvas.getContext("2d");
  canvas.width=w; canvas.height=h;

  const img=new Image();
  img.onload=()=>{
    ctx.filter=effect.value;
    ctx.drawImage(img,0,0,w,h);
    ctx.filter="none";

    if(border.value!=="none"){
      ctx.strokeStyle=border.value;
      ctx.lineWidth=20;
      ctx.strokeRect(0,0,w,h);
    }

    let fontStyle="";
    if(bold.checked) fontStyle+="bold ";
    if(italic.checked) fontStyle+="italic ";
    fontStyle+=`${Math.floor(w/20)}px ${font.value}`;
    ctx.font=fontStyle;

    ctx.fillStyle=textColor;
    ctx.textAlign=align.value;

    let y=h/2;
    if(vertical.value==="top") y=120;
    if(vertical.value==="bottom") y=h-120;

    wrapText(ctx,quote.value,
      align.value==="left"?100:align.value==="right"?w-100:w/2,
      y,w-200,60);

    // watermark
    ctx.font="20px Arial";
    ctx.fillStyle="rgba(255,255,255,0.7)";
    ctx.textAlign="right";
    ctx.fillText("LegendDetails.Blogspot.com",w-20,h-20);

    finalImage=canvas.toDataURL("image/png");
    const preview=document.getElementById("preview");
    preview.src=finalImage;
    preview.style.display="block";
    document.getElementById("downloadBtn").style.display="inline-block";
  };

  img.src=URL.createObjectURL(bg.files[0]);
}

function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words=text.split(" ");
  let line="", lines=[];
  for(let i=0;i<words.length;i++){
    let test=line+words[i]+" ";
    if(ctx.measureText(test).width>maxWidth && i>0){
      lines.push(line); line=words[i]+" ";
    } else line=test;
  }
  lines.push(line);
  y-=(lines.length-1)*lineHeight/2;
  lines.forEach(l=>{ ctx.fillText(l,x,y); y+=lineHeight; });
}
</script>
</body>
</html>
