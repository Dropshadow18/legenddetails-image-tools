<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Premium Quote Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #020617;
  color: #fff;
  font-family: 'Playfair Display', serif;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

h1 { text-align: center; }

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 10px;
  margin-bottom: 20px;
}

textarea, input, select, button {
  padding: 10px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
}

textarea { min-height: 120px; }

button {
  background: #facc15;
  font-weight: 600;
  cursor: pointer;
}

canvas {
  width: 100%;
  max-width: 900px;
  border-radius: 14px;
}
.preview { display: flex; justify-content: center; }
</style>
</head>

<body>
<div class="container">
<h1>Premium Quote Image Studio</h1>

<div class="controls">
<textarea id="quoteText" placeholder="Enter quote"></textarea>
<input id="highlightWord" placeholder="Highlight word">
<select id="language">
  <option value="en">English</option>
  <option value="te">Telugu</option>
</select>

<select id="style">
  <option value="center">Minimal Center</option>
  <option value="left">Editorial Left</option>
  <option value="box">Boxed Quote</option>
</select>

<input type="file" id="bgUpload" accept="image/*">
<button onclick="renderQuote()">Preview</button>
<button onclick="downloadImage()">Download 2× Image</button>
</div>

<div class="preview">
<canvas id="canvas" width="2400" height="2400"></canvas>
</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let bgImg = null;

document.getElementById("bgUpload").onchange = e => {
  const img = new Image();
  img.onload = () => { bgImg = img; renderQuote(); };
  img.src = URL.createObjectURL(e.target.files[0]);
};

function renderQuote() {
  const text = document.getElementById("quoteText").value;
  const highlight = document.getElementById("highlightWord").value;
  const lang = document.getElementById("language").value;
  const style = document.getElementById("style").value;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (bgImg) {
    ctx.drawImage(bgImg,0,0,canvas.width,canvas.height);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
  } else {
    ctx.fillStyle = "#020617";
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  ctx.textBaseline = "middle";
  ctx.fillStyle = "#f8fafc";

  ctx.font = lang === "te"
    ? "96px 'Noto Serif Telugu'"
    : "96px 'Playfair Display'";

  let x = canvas.width/2;
  let y = canvas.height/2;

  if(style === "left") {
    ctx.textAlign = "left";
    x = 300;
  } else {
    ctx.textAlign = "center";
  }

  if(style === "box") {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(400,900,1600,600);
    ctx.fillStyle = "#fff";
  }

  const lines = text.split("\n");
  lines.forEach((line,i)=>{
    let yy = y + (i * 120);
    if(highlight && line.includes(highlight)){
      ctx.fillText(line.replace(highlight,""),x,yy);
      ctx.fillStyle="#facc15";
      ctx.font=lang==="te"?"120px 'Noto Serif Telugu'":"120px 'Playfair Display'";
      ctx.fillText(highlight,x,yy+120);
      ctx.fillStyle="#fff";
      ctx.font=lang==="te"?"96px 'Noto Serif Telugu'":"96px 'Playfair Display'";
    } else {
      ctx.fillText(line,x,yy);
    }
  });

  ctx.globalAlpha = 0.4;
  ctx.font="36px Arial";
  ctx.fillText("LegendDetails",canvas.width/2,canvas.height-120);
  ctx.globalAlpha = 1;
}

function downloadImage() {
  const link=document.createElement("a");
  link.download="premium-quote-2x.png";
  link.href=canvas.toDataURL("image/png");
  link.click();
}

renderQuote();
</script>
</body>
</html>
