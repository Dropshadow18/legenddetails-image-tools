<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Image Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Noto+Sans+Telugu&family=Noto+Sans+Devanagari&family=Noto+Sans+Tamil&family=Noto+Sans+Kannada&display=swap" rel="stylesheet">

<style>
body{
margin:0;
padding:0;
font-family:Poppins,sans-serif;
background:#f2f2f2;
text-align:center;
}

h2{
margin-top:20px;
}

.container{
width:90%;
max-width:700px;
margin:auto;
}

textarea{
width:100%;
height:120px;
font-size:18px;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
outline:none;
resize:none;
}

select,button{
margin-top:10px;
padding:10px 14px;
font-size:16px;
border-radius:8px;
border:none;
cursor:pointer;
}

button{
background:#000;
color:#fff;
}

.canvasBox{
margin-top:20px;
position:relative;
}

canvas{
width:100%;
max-width:600px;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div class="container">

<h2>Quote Image Studio</h2>

<textarea id="quoteInput" placeholder="Type quote in Telugu, English, Hindi, Tamil, Kannada..."></textarea>

<br>

<select id="styleSelect">
<option value="style1">Style 1 Premium Gradient</option>
<option value="style2">Style 2 Gold Luxury</option>
<option value="style3">Style 3 Color Pop</option>
</select>

<br>
<button onclick="generate()">Generate Image</button>
<button onclick="download()">Download JPG</button>

<div class="canvasBox">
<canvas id="canvas" width="600" height="600"></canvas>
</div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function getFont(text){
if(/[ఀ-౿]/.test(text)) return "bold 42px Noto Sans Telugu";
if(/[ऀ-ॿ]/.test(text)) return "bold 42px Noto Sans Devanagari";
if(/[஀-௿]/.test(text)) return "bold 42px Noto Sans Tamil";
if(/[೦-೿]/.test(text)) return "bold 42px Noto Sans Kannada";
return "bold 44px Poppins";
}

function generate(){
let text=document.getElementById("quoteInput").value;
let style=document.getElementById("styleSelect").value;

ctx.clearRect(0,0,canvas.width,canvas.height);

if(style==="style1"){
let grad=ctx.createLinearGradient(0,0,600,600);
grad.addColorStop(0,"#ff512f");
grad.addColorStop(1,"#dd2476");
ctx.fillStyle=grad;
ctx.fillRect(0,0,600,600);
}

if(style==="style2"){
ctx.fillStyle="#111";
ctx.fillRect(0,0,600,600);
}

if(style==="style3"){
let grad=ctx.createLinearGradient(0,0,600,0);
grad.addColorStop(0,"#00c6ff");
grad.addColorStop(0.5,"#ff00cc");
grad.addColorStop(1,"#ffcc00");
ctx.fillStyle=grad;
ctx.fillRect(0,0,600,600);
}

ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillStyle="#fff";

let font=getFont(text);
ctx.font=font;

wrapText(text,300,300,500,50,style);
}

function wrapText(text,x,y,maxWidth,lineHeight,style){
let words=text.split(" ");
let line="";
let lines=[];

for(let n=0;n<words.length;n++){
let testLine=line+words[n]+" ";
let metrics=ctx.measureText(testLine);
let testWidth=metrics.width;

if(testWidth>maxWidth && n>0){
lines.push(line);
line=words[n]+" ";
}else{
line=testLine;
}
}
lines.push(line);

let startY=y-(lines.length/2)*lineHeight;

for(let i=0;i<lines.length;i++){

if(style==="style3"){
ctx.fillStyle=i%3===0?"#ffffff":i%3===1?"#ffe600":"#00ffd5";
}

if(style==="style2"){
ctx.fillStyle="#FFD700";
}

ctx.fillText(lines[i],x,startY+i*lineHeight);
}
}

function download(){
let link=document.createElement("a");
link.download="quote.jpg";
link.href=canvas.toDataURL("image/jpeg",1.0);
link.click();
}
</script>

</body>
</html>
