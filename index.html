<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Premium Quote Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&family=Noto+Serif+Telugu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Noto+Sans+Kannada:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial,sans-serif;}
.container{max-width:1300px;margin:auto;padding:20px;}
h1{text-align:center;margin-bottom:20px;}
.controls{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
textarea, select, input, button{padding:10px;border-radius:6px;border:none;}
textarea{min-height:130px;}
button{background:#facc15;font-weight:600;cursor:pointer;}
.toggle-btn{font-weight:600;cursor:pointer;}

.preview-wrap{display:flex;justify-content:center;margin-top:25px;}
.preview{
  width:1024px;
  aspect-ratio:16/9;
  padding:80px;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  background:#111;
}
.preview::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:var(--bg-image);
  background-size:cover;
  background-position:center;
  opacity:0.45;
}
.preview>*{position:relative;z-index:1;}
.quote-line{margin-bottom:28px;line-height:1.3;}
.highlight{
  font-weight:700;
  background:linear-gradient(90deg,var(--hc1),var(--hc2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.word{color:#fff;}

.watermark{
  position:absolute;
  top:15px;
  right:20px;
  font-size:22px;
  opacity:0.45;
}

.image-mode .word{text-shadow:2px 2px 4px rgba(0,0,0,0.8);}
.image-mode .highlight{text-shadow:2px 2px 8px rgba(0,0,0,0.9);}
</style>
</head>

<body>
<div class="container">
<h1>LegendDetails Premium Quote Studio</h1>

<div class="controls">
<textarea id="quoteText" placeholder="Paste quote here..." oninput="renderQuote()"></textarea>

<select id="language" oninput="renderQuote()">
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
</select>

<select id="fontType" oninput="renderQuote()">
<option value="Playfair Display">Playfair Display</option>
<option value="Roboto Slab">Roboto Slab</option>
<option value="Arial, sans-serif">Arial</option>
</select>

<input type="number" id="wordSize" value="56" oninput="renderQuote()">
<input type="number" id="highlightSize" value="92" oninput="renderQuote()">

<button class="toggle-btn" onclick="toggleBold()">Bold</button>
<button class="toggle-btn" onclick="toggleItalic()">Italic</button>

<label>Highlight Color 1</label>
<input type="color" id="hc1" value="#facc15" oninput="renderQuote()">

<label>Highlight Color 2</label>
<input type="color" id="hc2" value="#f97316" oninput="renderQuote()">

<input type="file" accept="image/*" onchange="setBg(event)">

<select id="imageSize" oninput="renderQuote()">
<option value="square">Square</option>
<option value="portrait">Portrait</option>
<option value="landscape">Landscape</option>
<option value="hd">HD</option>
</select>

<input type="text" id="imageName" value="legenddetails-quote">

<button onclick="downloadImage()">Download JPG</button>
</div>

<div class="preview-wrap">
<div class="preview" id="preview">
<div class="watermark">LegendDetails.Blogspot.Com</div>
</div>
</div>
</div>

<script>
let bold=false, italic=false, bgImg="";
const langFonts={
  en:null,
  te:"Noto Serif Telugu",
  hi:"Noto Sans Devanagari",
  ta:"Noto Sans Tamil",
  kn:"Noto Sans Kannada"
};

function toggleBold(){bold=!bold;renderQuote();}
function toggleItalic(){italic=!italic;renderQuote();}

function renderQuote(){
  const text=document.getElementById("quoteText").value.trim();
  const p=document.getElementById("preview");
  const lang=document.getElementById("language").value;
  const font=langFonts[lang]||document.getElementById("fontType").value;

  p.innerHTML='<div class="watermark">LegendDetails.Blogspot.Com</div>';
  if(!text)return;

  p.style.setProperty("--hc1",hc1.value);
  p.style.setProperty("--hc2",hc2.value);

  const words=text.split(" ");
  const hi=Math.floor(words.length/2);
  const line=document.createElement("div");
  line.className="quote-line";

  words.forEach((w,i)=>{
    const s=document.createElement("span");
    s.textContent=w+" ";
    s.style.fontFamily=font;
    s.style.fontSize=(i===hi?highlightSize.value:wordSize.value)+"px";
    if(bold)s.style.fontWeight="700";
    if(italic)s.style.fontStyle="italic";
    s.className=i===hi?"highlight":"word";
    line.appendChild(s);
  });
  p.appendChild(line);
}

function setBg(e){
  const r=new FileReader();
  r.onload=()=>{bgImg=r.result;preview.style.setProperty("--bg-image",`url(${bgImg})`);preview.classList.add("image-mode");renderQuote();}
  r.readAsDataURL(e.target.files[0]);
}

function downloadImage(){
  const name=imageName.value||"legenddetails-quote";
  html2canvas(preview,{scale:2}).then(c=>{
    const a=document.createElement("a");
    a.download=name+".jpg";
    a.href=c.toDataURL("image/jpeg",0.95);
    a.click();
  });
}

renderQuote();
</script>
</body>
</html>
