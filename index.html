<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Premium Quote Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #020617;
  color: #fff;
  font-family: 'Playfair Display', serif;
}
.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}
h1 { text-align: center; }

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 10px;
}
textarea, select, button {
  padding: 10px;
  border-radius: 6px;
  border: none;
}
textarea { min-height: 140px; }
button {
  background: #facc15;
  font-weight: 600;
  cursor: pointer;
}
.preview {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}
canvas {
  width: 100%;
  max-width: 900px;
  border-radius: 14px;
}
</style>
</head>

<body>
<div class="container">

<h1>Premium Quote Image Studio</h1>

<div class="controls">
<textarea id="quoteText" placeholder="Use:
[word|color|size]

Example:
Success is not [final|gold|120]
It is the [courage|white|150] to continue"></textarea>

<select id="language">
  <option value="en">English</option>
  <option value="te">Telugu</option>
</select>

<select id="template">
  <option value="center">Minimal Center</option>
  <option value="left">Editorial Left</option>
  <option value="focus">Highlight Focus</option>
  <option value="box">Boxed Quote</option>
</select>

<button onclick="renderQuote()">Preview</button>
<button onclick="downloadImage()">Download</button>
</div>

<div class="preview">
<canvas id="canvas" width="2400" height="2400"></canvas>
</div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function renderQuote() {
  const text = document.getElementById("quoteText").value;
  const lang = document.getElementById("language").value;
  const template = document.getElementById("template").value;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#020617";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let baseFont = lang === "te"
    ? "'Noto Serif Telugu'"
    : "'Playfair Display'";

  let align = "center";
  let startX = canvas.width / 2;
  let startY = canvas.height / 2 - 300;
  let lineGap = 160;

  if(template === "left") {
    align = "left";
    startX = 300;
  }
  if(template === "focus") {
    lineGap = 190;
  }
  if(template === "box") {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(350,700,1700,900);
    ctx.fillStyle = "#fff";
  }

  ctx.textAlign = align;
  ctx.textBaseline = "middle";

  let y = startY;

  text.split("\n").forEach(line => {
    let x = startX;
    parseLine(line).forEach(part => {
      let size = part.size || (template === "focus" ? 120 : 96);
      ctx.font = `${size}px ${baseFont}`;
      ctx.fillStyle = part.color || "#f8fafc";
      ctx.fillText(part.text, x, y);
      x += ctx.measureText(part.text).width;
    });
    y += lineGap;
  });

  ctx.globalAlpha = 0.35;
  ctx.font = "36px Arial";
  ctx.fillStyle = "#fff";
  ctx.fillText("LegendDetails", canvas.width / 2, canvas.height - 120);
  ctx.globalAlpha = 1;
}

function parseLine(line) {
  let regex = /\[(.*?)\|(.*?)\|(.*?)\]/g;
  let out = [];
  let last = 0;
  let m;

  while((m = regex.exec(line)) !== null) {
    if(m.index > last) out.push({ text: line.substring(last,m.index) });
    out.push({
      text: m[1],
      color: m[2] === "gold" ? "#d4af37" : m[2],
      size: parseInt(m[3])
    });
    last = regex.lastIndex;
  }
  if(last < line.length) out.push({ text: line.substring(last) });
  return out;
}

function downloadImage() {
  const link = document.createElement("a");
  link.download = "premium-quote.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

renderQuote();
</script>

</body>
</html>
