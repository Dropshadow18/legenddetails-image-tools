<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Premium Quote Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Arial:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin:0;
  background:#020617;
  color:#fff;
  font-family:Arial,sans-serif;
}
.container{
  max-width:1300px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  margin-bottom:20px;
}
.controls{
  display:grid;
  gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
}
textarea, select, button, input[type="file"], input[type="number"], input[type="color"]{
  padding:10px;
  border-radius:6px;
  border:none;
}
textarea{min-height:130px;}
button{background:#facc15;font-weight:600;cursor:pointer;}

.preview-wrap{
  display:flex;
  justify-content:center;
  margin-top:25px;
  position:relative;
}

/* ===== QUOTE BOX ===== */
.preview{
  width:1024px;
  aspect-ratio:16/9;
  padding:80px;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  box-sizing:border-box;
  position:relative;
  overflow:hidden;
}

/* Background image overlay */
.preview::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:var(--bg-image);
  background-size:cover;
  background-position:center;
  opacity:0.45;
  z-index:0;
}
.preview>*{position:relative;z-index:1;}

.quote-line{
  margin-bottom:28px;
  line-height:1.3;
  word-break:break-word;
}

.word{}
.highlight{font-weight:600;}

/* Telugu font */
.telugu .word, .telugu .highlight{font-family:'Noto Serif Telugu',serif;}

/* Footer */
.footer{margin-top:auto;font-size:18px;opacity:0.4;}

/* ===== PRESETS ===== */
.calm{background:#020617;}
.calm .highlight{color:#d4af37;}
.bold{background:#020617;}
.bold .highlight{color:#ef4444;}
.spiritual{background:linear-gradient(180deg,#020617,#041b2d);}
.spiritual .highlight{color:#a5f3fc;}
.royal{background:linear-gradient(180deg,#1e0038,#020617);}
.royal .highlight{color:#c084fc;}
.sunset{background:linear-gradient(180deg,#3b0a0a,#020617);}
.sunset .highlight{color:#fb923c;}
.ocean{background:linear-gradient(180deg,#041f2d,#020617);}
.ocean .highlight{color:#38bdf8;}
.mono{background:#000;}
.mono .word{color:#e5e7eb;}
.mono .highlight{color:#fff;}
.neon{background:#020617;}
.neon .highlight{color:#22d3ee;text-shadow:0 0 6px #22d3ee,0 0 14px #22d3ee;}

/* ===== IMAGE MODE ===== */
.image-mode{background:#000 !important;}
.image-mode::before{opacity:0.55 !important;}
.image-mode .word{text-shadow:0 2px 6px rgba(0,0,0,0.8);}
.image-mode .highlight{text-shadow:0 2px 10px rgba(0,0,0,0.9);}

/* ===== BORDER STYLES ===== */
.rounded{border-radius:18px;}
.circle{border-radius:50%;}
.shadow{box-shadow:0 10px 30px rgba(0,0,0,0.6);}
.outline{border:5px solid #facc15;}
.solid{border-style:solid;}
.dotted{border-style:dotted;}
.dashed{border-style:dashed;}
.double{border-style:double;}
.groove{border-style:groove;}
.ridge{border-style:ridge;}
.inset{border-style:inset;}
.outset{border-style:outset;}

/* ===== WATERMARK ===== */
.watermark{
  position:absolute;
  top:15px;
  right:20px;
  font-family:'Playfair Display', serif;
  font-size:22px;
  font-weight:600;
  color:rgba(255,255,255,0.45);
  z-index:10;
}
</style>
</head>
<body>
<div class="container">

<h1>Premium Quote Image Studio</h1>

<div class="controls">
<textarea id="quoteText" placeholder="Paste quote here..." oninput="renderQuote()"></textarea>

<select id="language" oninput="renderQuote()">
  <option value="en">English</option>
  <option value="te">Telugu</option>
</select>

<select id="preset" oninput="renderQuote()">
  <option value="calm">Calm Wisdom</option>
  <option value="bold">Bold Motivation</option>
  <option value="spiritual">Soft Spiritual</option>
  <option value="royal">Royal Purple</option>
  <option value="sunset">Sunset Glow</option>
  <option value="ocean">Ocean Blue</option>
  <option value="mono">Minimal Mono</option>
  <option value="neon">Dark Neon</option>
</select>

<input type="file" id="bgImage" accept="image/*" onchange="setBackgroundImage(event)">

<select id="imageSize" oninput="renderQuote()">
  <option value="square">Square 1200×1200</option>
  <option value="portrait">Portrait 900×1125</option>
  <option value="landscape">Landscape 1024×675</option>
  <option value="hd">Full HD 1280×720</option>
</select>

<select id="borderStyle" oninput="renderQuote()">
  <option value="rounded">Rounded</option>
  <option value="circle">Circle</option>
  <option value="shadow">Shadow</option>
  <option value="outline">Outline</option>
  <option value="solid">Solid</option>
  <option value="dotted">Dotted</option>
  <option value="dashed">Dashed</option>
  <option value="double">Double</option>
  <option value="groove">Groove</option>
  <option value="ridge">Ridge</option>
  <option value="inset">Inset</option>
  <option value="outset">Outset</option>
</select>

<input type="color" id="borderColor" value="#facc15" oninput="renderQuote()">
<input type="color" id="wordColor" value="#ffffff" oninput="renderQuote()">
<input type="color" id="highlightColor" value="#facc15" oninput="renderQuote()">

<input type="number" id="wordSize" min="10" max="300" value="56" oninput="renderQuote()">
<input type="number" id="highlightSize" min="10" max="300" value="92" oninput="renderQuote()">

<select id="fontType" oninput="renderQuote()">
  <option value="Playfair Display">Playfair Display</option>
  <option value="Arial, sans-serif">Sans-serif</option>
  <option value="Noto Serif Telugu">Noto Serif Telugu</option>
</select>

<button onclick="renderQuote()">Preview</button>
<button onclick="downloadImage()">Download</button>
</div>

<div class="preview-wrap">
<div class="preview calm rounded" id="preview">
  <div class="watermark">LegendDetails.Blogspot.Com</div>
</div>
</div>

</div>

<script>
let bgImageURL="";
function renderQuote(){
  const text=document.getElementById("quoteText").value.trim();
  const preset=document.getElementById("preset").value;
  const lang=document.getElementById("language").value;
  const preview=document.getElementById("preview");

  // Reset classes
  preview.className=`preview ${preset} ${lang==='te'?'telugu':''}`;
  preview.classList.add(document.getElementById("borderStyle").value);
  if(bgImageURL) preview.classList.add("image-mode");

  // Image sizes
  const size=document.getElementById("imageSize").value;
  let w=1024, h=576;
  if(size==='square'){ w=1200; h=1200; }
  if(size==='portrait'){ w=900; h=1125; }
  if(size==='landscape'){ w=1024; h=675; }
  if(size==='hd'){ w=1280; h=720; }
  preview.style.width=w+'px';
  preview.style.height=h+'px';

  // Border color
  preview.style.borderColor=document.getElementById("borderColor").value;

  // Clear previous text
  preview.innerHTML='<div class="watermark">LegendDetails.Blogspot.Com</div>';
  if(!text) return;

  const fontType=document.getElementById("fontType").value;
  const wordSize=parseInt(document.getElementById("wordSize").value);
  const highlightSize=parseInt(document.getElementById("highlightSize").value);
  const wordColor=document.getElementById("wordColor").value;
  const highlightColor=document.getElementById("highlightColor").value;

  const lines=text.split("\n");
  lines.forEach(line=>{
    const words=line.split(" ");
    const highlightIndex=Math.floor(words.length/2);
    const lineDiv=document.createElement("div");
    lineDiv.className="quote-line";
    words.forEach((word,i)=>{
      const span=document.createElement("span");
      span.textContent=word+" ";
      span.style.fontFamily=fontType;
      span.style.fontSize=(i===highlightIndex?highlightSize:wordSize)+"px";
      span.style.color=(i===highlightIndex?highlightColor:wordColor);
      span.className=i===highlightIndex?"highlight":"word";
      lineDiv.appendChild(span);
    });
    preview.appendChild(lineDiv);
  });
}

function setBackgroundImage(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    bgImageURL=reader.result;
    const preview=document.getElementById("preview");
    preview.style.setProperty("--bg-image",`url(${bgImageURL})`);
    preview.classList.add("image-mode");
    renderQuote();
  };
  reader.readAsDataURL(file);
}

function clearBackground(){
  bgImageURL="";
  const preview=document.getElementById("preview");
  preview.style.setProperty("--bg-image","none");
  preview.classList.remove("image-mode");
  renderQuote();
}

function downloadImage(){
  html2canvas(document.getElementById("preview"),{scale:2,backgroundColor:null}).then(canvas=>{
    const link=document.createElement("a");
    link.download="legenddetails-quote.png";
    link.href=canvas.toDataURL("image/png");
    link.click();
  });
}

renderQuote();
</script>

</body>
</html>
