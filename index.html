<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails Quote Image Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f6f8;
}
.container {
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.tool {
  background:#fff;
  padding:20px;
  margin-bottom:20px;
  border-radius:8px;
}
label { font-weight:bold; margin-top:10px; display:block; }
input, textarea, select {
  width:100%;
  padding:8px;
  margin-top:5px;
}
.row { display:flex; gap:10px; flex-wrap:wrap; }
.row > div { flex:1; }
.colors span {
  width:25px; height:25px; display:inline-block;
  cursor:pointer; border:1px solid #000;
}
button {
  background:#007bff; color:#fff;
  padding:12px 20px; border:none;
  font-size:16px; cursor:pointer;
}
canvas { display:none; }
</style>
</head>

<body>
<div class="container">
<h1>LegendDetails – Quote Image Tool</h1>

<div class="tool">
<label>1. Post Title</label>
<input id="title">

<label>2. Upload Background Image</label>
<input type="file" id="bg" accept="image/*">

<label>3. Quote Text (Any Language)</label>
<textarea id="quote" rows="4"></textarea>

<label>4. Font Style</label>
<select id="font">
  <option value="Arial">Arial</option>
  <option value="Georgia">Georgia</option>
  <option value="Times New Roman">Times New Roman</option>
  <option value="Verdana">Verdana</option>
</select>

<label>5. Text Alignment</label>
<div class="row">
  <select id="align">
    <option value="center">Center</option>
    <option value="left">Left</option>
    <option value="right">Right</option>
  </select>
  <select id="vertical">
    <option value="middle">Middle</option>
    <option value="top">Top</option>
    <option value="bottom">Bottom</option>
  </select>
</div>

<label>6. Text Style</label>
<input type="checkbox" id="bold"> Bold
<input type="checkbox" id="italic"> Italic

<label>7. Text Color</label>
<div class="colors" id="colors"></div>

<label>8. Image Border</label>
<select id="border">
  <option value="none">None</option>
  <option value="white">White Border</option>
  <option value="black">Black Border</option>
</select>

<label>9. Image Effect</label>
<select id="effect">
  <option value="none">None</option>
  <option value="grayscale(1)">Grayscale</option>
  <option value="blur(2px)">Blur</option>
</select>

<label>10. Image Size</label>
<select id="size">
  <option value="1200x675">1200×675</option>
  <option value="1600x900">1600×900</option>
  <option value="2400x1350">2400×1350</option>
</select>

<button onclick="generate()">Download Image</button>
</div>

<canvas id="canvas"></canvas>
</div>

<script>
const colors = ["#ffffff","#000000","#ff0000","#00ff00","#0000ff","#ffff00","#ff00ff","#00ffff"];
let selectedColor = "#ffffff";

const colorDiv = document.getElementById("colors");
colors.forEach(c=>{
  const s=document.createElement("span");
  s.style.background=c;
  s.onclick=()=>selectedColor=c;
  colorDiv.appendChild(s);
});

function slugify(t){
  return t.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g,"-");
}

function generate(){
  const title = title.value;
  const quote = document.getElementById("quote").value;
  const file = bg.files[0];
  if(!title || !quote || !file){ alert("Fill all fields"); return; }

  const [w,h]=size.value.split("x");
  const c=canvas, ctx=c.getContext("2d");
  c.width=w; c.height=h;

  const img=new Image();
  img.onload=()=>{
    ctx.filter=effect.value;
    ctx.drawImage(img,0,0,w,h);
    ctx.filter="none";

    // border
    if(border.value!=="none"){
      ctx.strokeStyle=border.value;
      ctx.lineWidth=20;
      ctx.strokeRect(0,0,w,h);
    }

    let style="";
    if(bold.checked) style+="bold ";
    if(italic.checked) style+="italic ";
    style+=`${Math.floor(w/20)}px ${font.value}`;
    ctx.font=style;
    ctx.fillStyle=selectedColor;
    ctx.textAlign=align.value;

    let y=h/2;
    if(vertical.value==="top") y=100;
    if(vertical.value==="bottom") y=h-100;

    wrap(ctx,quote,align.value==="left"?80:align.value==="right"?w-80:w/2,y,w-160,60);

    // watermark
    ctx.font="20px Arial";
    ctx.fillStyle="rgba(255,255,255,0.7)";
    ctx.textAlign="right";
    ctx.fillText("LegendDetails.Blogspot.com",w-20,h-20);

    const a=document.createElement("a");
    a.download=slugify(title)+".png";
    a.href=c.toDataURL();
    a.click();
  };
  img.src=URL.createObjectURL(file);
}

function wrap(ctx,text,x,y,maxW,lineH){
  const words=text.split(" ");
  let line="", lines=[];
  words.forEach(w=>{
    const t=line+w+" ";
    if(ctx.measureText(t).width>maxW){ lines.push(line); line=w+" "; }
    else line=t;
  });
  lines.push(line);
  y-=(lines.length-1)*lineH/2;
  lines.forEach(l=>{ ctx.fillText(l,x,y); y+=lineH; });
}
</script>
</body>
</html>
