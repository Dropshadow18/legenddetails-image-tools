<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Quote Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  background: #020617;
  color: #fff;
}
.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}
.controls {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
}
textarea, select, button {
  padding: 10px;
  border-radius: 6px;
  border: none;
}
button {
  background: #facc15;
  font-weight: 600;
  cursor: pointer;
}
.preview-wrap {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}
.preview {
  width: 900px;
  aspect-ratio: 1/1;
  background: linear-gradient(180deg,#020617,#020617);
  border-radius: 18px;
  padding: 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}
.quote-line {
  margin-bottom: 30px;
  line-height: 1.3;
  word-break: break-word;
}
.word {
  font-size: 56px;
  font-family: 'Playfair Display', serif;
}
.highlight {
  font-size: 92px;
  color: #d4af37;
  font-weight: 600;
}
.bold .highlight { color: #ef4444; }
.spiritual .highlight { color: #a5f3fc; }

.footer {
  margin-top: auto;
  opacity: 0.4;
  font-size: 18px;
}
.telugu .word,
.telugu .highlight {
  font-family: 'Noto Serif Telugu', serif;
}
</style>
</head>

<body>
<div class="container">

<div class="controls">
<textarea id="quoteText" placeholder="Paste quote here"></textarea>

<select id="language">
  <option value="en">English</option>
  <option value="te">Telugu</option>
</select>

<select id="preset">
  <option value="calm">Calm Wisdom</option>
  <option value="bold">Bold Motivation</option>
  <option value="spiritual">Soft Spiritual</option>
</select>

<button onclick="renderQuote()">Preview</button>
<button onclick="downloadImage()">Download</button>
</div>

<div class="preview-wrap">
<div id="preview" class="preview calm"></div>
</div>

</div>

<script>
function renderQuote() {
  const text = document.getElementById("quoteText").value.trim();
  const preset = document.getElementById("preset").value;
  const lang = document.getElementById("language").value;
  const box = document.getElementById("preview");

  box.className = `preview ${preset} ${lang === 'te' ? 'telugu' : ''}`;
  box.innerHTML = "";

  const lines = text.split("\n");

  lines.forEach(line => {
    const words = line.split(" ");
    const highlightIndex = Math.floor(words.length / 2);

    const lineDiv = document.createElement("div");
    lineDiv.className = "quote-line";

    words.forEach((w, i) => {
      const span = document.createElement("span");
      span.textContent = w + " ";
      span.className = i === highlightIndex ? "highlight" : "word";
      lineDiv.appendChild(span);
    });

    box.appendChild(lineDiv);
  });

  const footer = document.createElement("div");
  footer.className = "footer";
  footer.textContent = "LegendDetails";
  box.appendChild(footer);
}

function downloadImage() {
  html2canvas(document.getElementById("preview"), {
    scale: 2,
    backgroundColor: null
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "premium-quote.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

renderQuote();
</script>

</body>
</html>
