<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Premium Quote Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&family=Poppins:wght@400;700&family=Montserrat:wght@400;700&family=Noto+Serif+Telugu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Noto+Sans+Kannada:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial;}
.container{max-width:1300px;margin:auto;padding:20px;}
h1{text-align:center;margin-bottom:20px;}
.controls{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
textarea, select, input, button{padding:10px;border-radius:6px;border:none;}
textarea{min-height:130px;}
button{background:#facc15;font-weight:700;cursor:pointer;}

.preview-wrap{display:flex;justify-content:center;margin-top:25px;}
.preview{
width:1024px;
aspect-ratio:16/9;
padding:80px;
border-radius:18px;
display:flex;
flex-direction:column;
justify-content:center;
text-align:center;
box-sizing:border-box;
position:relative;
overflow:hidden;
background:#111;
}
.preview::before{
content:"";
position:absolute;
inset:0;
background-image:var(--bg-image);
background-size:cover;
background-position:center;
opacity:0.45;
}
.preview>*{position:relative;z-index:2;}
.quote-line{margin-bottom:25px;line-height:1.3;word-break:break-word;}

.highlight1{color:#facc15;}
.highlight2{color:#ff4ecd;}
.highlight3{color:#00eaff;}
.highlight4{color:#00ff95;}

.watermark{
position:absolute;
top:15px;
right:20px;
font-family:'Playfair Display';
font-size:22px;
color:rgba(255,255,255,0.45);
z-index:5;
}
</style>
</head>

<body>
<div class="container">
<h1>LegendDetails Premium Quote Studio</h1>

<div class="controls">
<textarea id="quoteText" placeholder="Use *word*  #word#  @word@  %word% for multi highlight" oninput="renderQuote()"></textarea>

<label>Language</label>
<select id="language" oninput="renderQuote()">
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
</select>

<label>English Font</label>
<select id="fontType" oninput="renderQuote()">
<option value="Playfair Display">Playfair Display</option>
<option value="Poppins">Poppins</option>
<option value="Montserrat">Montserrat</option>
<option value="Roboto Slab">Roboto Slab</option>
</select>

<label>Word Size</label>
<input type="number" id="wordSize" value="56" min="10" max="300" oninput="renderQuote()">

<label>Highlight Size</label>
<input type="number" id="highlightSize" value="90" min="10" max="300" oninput="renderQuote()">

<input type="file" id="bgImage" accept="image/*" onchange="setBackgroundImage(event)">

<label>Image Size</label>
<select id="imageSize" oninput="renderQuote()">
<option value="landscape">Landscape 1024×675</option>
<option value="square">Square 1200×1200</option>
<option value="portrait">Pinterest 1000×1500</option>
<option value="hd">HD 1280×720</option>
</select>

<label>Image Name</label>
<input type="text" id="imageName" value="legenddetails-quote">

<button onclick="downloadImage()">Download JPG</button>
</div>

<div class="preview-wrap">
<div class="preview" id="preview">
<div class="watermark">LegendDetails.Blogspot.Com</div>
</div>
</div>
</div>

<script>
let bgImageURL="";

const langFonts={
en:null,
te:"Noto Serif Telugu",
hi:"Noto Sans Devanagari",
ta:"Noto Sans Tamil",
kn:"Noto Sans Kannada"
};

function renderQuote(){
const text=quoteText.value.trim();
const preview=document.getElementById("preview");
const lang=language.value;

let width=1024, ar='16/9';
if(imageSize.value==='square'){width=1200;ar='1/1'}
if(imageSize.value==='portrait'){width=1000;ar='2/3'}
if(imageSize.value==='hd'){width=1280;ar='16/9'}

preview.style.width=width+'px';
preview.style.aspectRatio=ar;
preview.innerHTML='<div class="watermark">LegendDetails.Blogspot.Com</div>';

if(!text) return;

const font=langFonts[lang]||fontType.value;
const lines=text.split("\n");

lines.forEach(line=>{
const div=document.createElement("div");
div.className="quote-line";

let words=line.split(" ");

words.forEach(w=>{
let span=document.createElement("span");
let clean=w.replace(/[*#@%]/g,'');

span.textContent=clean+" ";
span.style.fontFamily=font;

if(w.startsWith("*") && w.endsWith("*")){
span.className="highlight1";
span.style.fontSize=highlightSize.value+"px";
}
else if(w.startsWith("#") && w.endsWith("#")){
span.className="highlight2";
span.style.fontSize=highlightSize.value+"px";
}
else if(w.startsWith("@") && w.endsWith("@")){
span.className="highlight3";
span.style.fontSize=highlightSize.value+"px";
}
else if(w.startsWith("%") && w.endsWith("%")){
span.className="highlight4";
span.style.fontSize=highlightSize.value+"px";
}
else{
span.style.fontSize=wordSize.value+"px";
}

div.appendChild(span);
});

preview.appendChild(div);
});
}

function setBackgroundImage(e){
const r=new FileReader();
r.onload=()=>{
bgImageURL=r.result;
preview.style.setProperty("--bg-image",`url(${bgImageURL})`);
renderQuote();
}
r.readAsDataURL(e.target.files[0]);
}

function downloadImage(){
const name=imageName.value||"legenddetails-quote";
html2canvas(preview,{scale:2}).then(c=>{
const a=document.createElement("a");
a.download=name+".jpg";
a.href=c.toDataURL("image/jpeg",0.95);
a.click();
});
}

renderQuote();
</script>
</body>
</html>
