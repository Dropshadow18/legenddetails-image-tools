<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Auto Quote Presets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #020617;
  color: #fff;
  font-family: 'Playfair Display', serif;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-weight: 600;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 10px;
}

textarea, select, button {
  padding: 10px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
}

textarea {
  min-height: 130px;
}

button {
  background: #facc15;
  font-weight: 600;
  cursor: pointer;
}

.preview {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}

canvas {
  width: 100%;
  max-width: 900px;
  border-radius: 14px;
}
</style>
</head>

<body>
<div class="container">

<h1>Premium Quote Image Studio</h1>

<div class="controls">
<textarea id="quoteText" placeholder="Paste quote here (English / Telugu)
Example:
Life does not get easier
You get stronger with courage"></textarea>

<select id="language">
  <option value="en">English</option>
  <option value="te">Telugu</option>
</select>

<select id="preset">
  <option value="calm">Calm Wisdom</option>
  <option value="bold">Bold Motivation</option>
  <option value="hero">Hero Word</option>
  <option value="spiritual">Soft Spiritual</option>
</select>

<button onclick="renderQuote()">Preview</button>
<button onclick="downloadImage()">Download</button>
</div>

<div class="preview">
<canvas id="canvas" width="2400" height="2400"></canvas>
</div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function renderQuote() {
  const text = document.getElementById("quoteText").value.trim();
  const lang = document.getElementById("language").value;
  const preset = document.getElementById("preset").value;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Background
  ctx.fillStyle = "#020617";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const fontFamily = lang === "te"
    ? "'Noto Serif Telugu'"
    : "'Playfair Display'";

  let startY = 700;
  let lineGap = 170;
  let baseSize = 96;
  let highlightSize = 140;
  let highlightColor = "#d4af37";

  if(preset === "bold") {
    highlightColor = "#ef4444";
    highlightSize = 150;
  }
  if(preset === "hero") {
    highlightColor = "#facc15";
    highlightSize = 170;
    lineGap = 190;
  }
  if(preset === "spiritual") {
    highlightColor = "#a5f3fc";
    highlightSize = 140;
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  let lines = text.split("\n");
  let y = startY;

  lines.forEach(line => {
    let words = line.split(" ");
    let highlightIndex = Math.floor(words.length / 2);

    let x = canvas.width / 2;

    words.forEach((word, i) => {
      let isHighlight = i === highlightIndex;

      ctx.font = `${isHighlight ? highlightSize : baseSize}px ${fontFamily}`;
      ctx.fillStyle = isHighlight ? highlightColor : "#f8fafc";

      ctx.fillText(word + " ", x, y);
      x += ctx.measureText(word + " ").width;
    });

    y += lineGap;
  });

  // Footer
  ctx.globalAlpha = 0.35;
  ctx.font = "36px Arial";
  ctx.fillStyle = "#fff";
  ctx.fillText("LegendDetails", canvas.width / 2, canvas.height - 120);
  ctx.globalAlpha = 1;
}

function downloadImage() {
  const link = document.createElement("a");
  link.download = "premium-quote.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

renderQuote();
</script>

</body>
</html>
