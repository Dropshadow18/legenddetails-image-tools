<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LegendDetails – Premium Quote Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #020617;
  color: #fff;
  font-family: 'Playfair Display', serif;
}
.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}
h1 { text-align: center; }
.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 10px;
}
textarea, select, button {
  padding: 10px;
  border-radius: 6px;
  border: none;
}
textarea { min-height: 140px; }
button {
  background: #facc15;
  font-weight: 600;
  cursor: pointer;
}
.preview { display: flex; justify-content: center; margin-top: 20px; }
canvas {
  width: 100%;
  max-width: 900px;
  border-radius: 14px;
}
.tip {
  opacity: 0.6;
  font-size: 13px;
  margin-top: 5px;
}
</style>
</head>

<body>
<div class="container">

<h1>Premium Quote Image Studio</h1>

<div class="controls">
<textarea id="quoteText" placeholder="Use format:
[word|color|size]

Example:
Success is not [final|gold|120]
It is the [courage|white|140] to continue"></textarea>

<select id="language">
  <option value="en">English</option>
  <option value="te">Telugu</option>
</select>

<button onclick="renderQuote()">Preview</button>
<button onclick="downloadImage()">Download Image</button>
</div>

<div class="tip">Tip: Colors can be gold, red, white or hex (#d4af37)</div>

<div class="preview">
<canvas id="canvas" width="2400" height="2400"></canvas>
</div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function renderQuote() {
  const text = document.getElementById("quoteText").value;
  const lang = document.getElementById("language").value;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Background
  ctx.fillStyle = "#020617";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  let baseFont = lang === "te"
    ? "'Noto Serif Telugu'"
    : "'Playfair Display'";

  let y = canvas.height / 2 - 200;

  text.split("\n").forEach(line => {
    let x = canvas.width / 2;
    let parts = parseLine(line);

    parts.forEach(p => {
      ctx.font = `${p.size || 96}px ${baseFont}`;
      ctx.fillStyle = p.color || "#f8fafc";
      ctx.fillText(p.text, x, y);
      x += ctx.measureText(p.text).width;
    });

    y += 150;
  });

  ctx.globalAlpha = 0.4;
  ctx.font = "36px Arial";
  ctx.fillStyle = "#fff";
  ctx.fillText("LegendDetails", canvas.width / 2, canvas.height - 120);
  ctx.globalAlpha = 1;
}

function parseLine(line) {
  let regex = /\[(.*?)\|(.*?)\|(.*?)\]/g;
  let result = [];
  let lastIndex = 0;
  let match;

  while ((match = regex.exec(line)) !== null) {
    if (match.index > lastIndex) {
      result.push({ text: line.substring(lastIndex, match.index) });
    }
    result.push({
      text: match[1],
      color: match[2] === "gold" ? "#d4af37" : match[2],
      size: parseInt(match[3])
    });
    lastIndex = regex.lastIndex;
  }

  if (lastIndex < line.length) {
    result.push({ text: line.substring(lastIndex) });
  }

  return result;
}

function downloadImage() {
  const link = document.createElement("a");
  link.download = "premium-quote.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

renderQuote();
</script>

</body>
</html>
